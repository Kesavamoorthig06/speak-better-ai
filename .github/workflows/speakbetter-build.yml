name: speakbetter-build
on:
  push:
    branches: [speakbetter-orb-theme]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Commit source changes (one-time bootstrap)
        run: |
          if grep -q orb-theme frontend/src/main.jsx; then echo "already applied"; exit 0; fi
          echo '' | base64 -d | gunzip > /tmp/src.patch
          git apply --index /tmp/src.patch
          (cd frontend && npm i -D tailwindcss@4 @tailwindcss/vite@4 --no-audit --no-fund)
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SpeakBetter: wire Tailwind v4, fix CSS import case, relative /upload/ URL, Docker + nginx deploy files, dark orb theme"
          git push origin HEAD:speakbetter-orb-theme
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          TAG=orb-$(git rev-parse --short HEAD)
          docker build -f Dockerfile.frontend -t ghcr.io/$OWNER/speakbetter-frontend:$TAG -t ghcr.io/$OWNER/speakbetter-frontend:orb .
          docker push ghcr.io/$OWNER/speakbetter-frontend:$TAG
          docker push ghcr.io/$OWNER/speakbetter-frontend:orb
          echo "pushed tag $TAG"
